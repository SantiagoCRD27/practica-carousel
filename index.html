<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar">
        <h1>Videojuegos</h1>
        <ul class="menu">
            <li><a href="">Inicio</a></li>
            <li><a href="">Servicios</a></li>
            <li><a href="">Galeria</a></li>
            <li><a href="">Contactos</a></li>
        </ul>
    </nav>

        <section class="carousel">
        <div class="slides">
            <img src="/img/banner1.jpg" alt="">
            <img src="/img/banner intermedio.jpg" alt="">
            <img src="/img/banner2.jpg" alt="">
        </div>
    </section>
    
    <section class="hero">
        <div class="htexto">
            <h2>¿Te interesan los videojuegos?</h2>
            <p>
                Unete a nuestro equipo y empieza a integrarte en el mundo de los videojuegos
            </p>
            <button>Me interesa</button>
        </div>
        <div class="himg">
            <video src="/img/minecraftvideo.mp4" autoplay muted loop playsinline></video>
        </div>
    </section>

    <section class="cards">
        <div class="card">
            <img src="/img/Skirym.jpg" alt="">
            <h3>Skyrim</h3>
            <p>Diseña tu propio mundo</p>
        </div>
        <div class="card">
            <img src="/img/GOW.jpg" alt="">
            <h3>God of War</h3>
            <p>Crea y moldea tus personajes</p>
        </div>
        <div class="card">
            <img src="/img/RDR.jpg" alt="">
            <h3>RDR</h3>
            <p>Imagina y diseña tus propias historias</p>
        </div>
    </section>

</body>
</html>
